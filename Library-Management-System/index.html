<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1>Library Management System</h1>
      <div class="header-actions">
        <button id="clearDataBtn" class="ghost">Reset Data</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add Book</h2>
      <form id="addBookForm" class="grid">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required>
        </div>
        <div class="field">
          <label for="author">Author</label>
          <input type="text" id="author" name="author" required>
        </div>
        <div class="field">
          <label for="isbn">ISBN</label>
          <input type="text" id="isbn" name="isbn" required>
        </div>
        <div class="actions">
          <button type="submit" class="primary">Add Book</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Inventory</h2>
        <div class="list-actions">
          <input type="text" id="searchInput" placeholder="Search by title, author, ISBN">
        </div>
      </div>
      <div class="table-wrap">
        <table id="booksTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>ISBN</th>
              <th>Status</th>
              <th>Borrower</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="booksTbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <span>Inventory: <strong id="inventoryCount">0</strong> total, <strong id="availableCount">0</strong> available</span>
    </div>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
